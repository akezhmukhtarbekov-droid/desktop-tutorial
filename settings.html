    <main class="main-content">
        <h2>Настройки профиля</h2>

        <div class="task-block">
            <h3>Редактирование личных данных</h3>
            <form class="settings-form">
                <div class="form-group">
                    <label>ФИО:</label>
                    <input type="text" placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" placeholder="ivanov@qoldau.kz">
                </div>
                <button type="submit" class="btn-save">Сохранить изменения</button>
            </form>
        </div>

        <div class="task-block">
            <h3>Безопасность</h3>
            <form class="settings-form">
                <div class="form-group">
                    <label>Старый пароль:</label>
                    <input type="password">
                </div>
                <div class="form-group">
                    <label>Новый пароль:</label>
                    <input type="password">
                </div>
                <button type="submit" class="btn-save">Изменить пароль</button>
            </form>
        </div>

        <div class="task-block">
            <h3>Настройка уведомлений</h3>
            <div class="checkbox-group">
                <label><input type="checkbox" checked> Новые обращения по Email</label><br>
                <label><input type="checkbox"> Системные уведомления</label><br>
