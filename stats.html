<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика — QoldaU.kz</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-container { display: flex; gap: 20px; margin-top: 20px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; text-align: center; }
        .stat-card h3 { font-size: 2.5em; margin: 10px 0; color: #3498db; }
    </style>
</head>
<body>
    <div class="main-content">
        <h2>Ваша продуктивность</h2>
        <div class="stats-container">
            <div class="stat-card">
                <p>Выполнено за месяц</p>
                <h3>145</h3>
            </div>
            <div class="stat-card">
                <p>Средняя оценка</p>
                <h3>4.9</h3>
            </div>
            <div class="stat-card">
                <p>Просрочено</p>
                <h3 style="color: #e74c3c;">0</h3>
            </div>
        </div>
    </div>
    <main class="main-content">
    <h2>Аналитика и отчёты</h2>
    <div style="display: flex; gap: 20px;">
        <div class="task-block" style="flex: 1; text-align: center;">
            <h4>Обработано за месяц</h4>
            <p style="font-size: 24px; color: green; font-weight: bold;">145</p>
        </div>
        <div class="task-block" style="flex: 1; text-align: center;">
            <h4>Среднее время ответа</h4>
            <p style="font-size: 24px; color: blue; font-weight: bold;">2.5 часа</p>
        </div>
        <div class="task-block" style="flex: 1; text-align: center;">
            <h4>В ожидании</h4>
            <p style="font-size: 24px; color: red; font-weight: bold;">12</p>
        </div>
    </div>
    <div class="task-block">
        <h3>Сформировать отчет</h3>
        <select>
            <option>За текущую неделю</option>
            <option>За месяц</option>
            <option>За год</option>
        </select>
        <button class="btn login">Скачать PDF</button>
    </div>
</main>
</body>
</html>
