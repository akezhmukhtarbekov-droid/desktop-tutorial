!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Qamqor.ai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <h1 class="logo">Qamqor.ai</h1>
            <p class="logo-subtitle">Городская система управления</p>
        </div>
        <div class="auth">
            <a href="index.html" class="login">На главную</a>
            <a href="login.html" class="login">Войти</a>
        </div>
    </header>

    <div class="form-container">
        <h2 class="form-title">Регистрация</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="iin">ИИН (12 цифр)</label>
                <input type="text" id="iin" name="iin" maxlength="12" pattern="[0-9]{12}" required placeholder="Введите ИИН">
            </div>

            <div class="form-group">
                <label for="full_name">ФИО</label>
                <input type="text" id="full_name" name="full_name" required placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 700 123 45 67">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
            </div>

            <div class="form-group">
                <label for="password_confirm">Подтвердите пароль</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="6" placeholder="Повторите пароль">
            </div>

            <button type="submit" class="btn">Зарегистрироваться</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #718096;">
            Уже есть аккаунт? <a href="login.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Войти</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;

            if (password !== password_confirm) {
                alert('Пароли не совпадают!');
                return;
            }

            const formData = {
                iin: document.getElementById('iin').value,
                full_name: document.getElementById('full_name').value,
                phone: document.getElementById('phone').value,
                password: password
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    alert('✅ ' + data.message);
                    window.location.href = 'login.html';
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (error) {
                alert('❌ Ошибка соединения с сервером');
                console.error(error);
            }
        });
    </script>
</body>
</html>
